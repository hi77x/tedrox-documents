name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release -p tdx-cli
      - name: Stage portable package
        shell: pwsh
        run: |
          $stage = "dist/tdx-doc-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/tdx-doc.exe $stage/
          Copy-Item -Path LICENSE, README.md, THIRD_PARTY_LICENSES.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath dist/tdx-doc-windows-x86_64.zip
      - name: Checksums
        shell: pwsh
        run: |
          $lines = @()
          $lines += "$((Get-FileHash dist/tdx-doc-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower())  tdx-doc-windows-x86_64.zip"
          $lines += "$((Get-FileHash dist/tdx-doc-windows-x86_64/tdx-doc.exe -Algorithm SHA256).Hash.ToLower())  tdx-doc.exe"
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*

  desktop:
    name: Desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npx tauri build --bundles nsis
      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $installer = Get-ChildItem -Path target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item -LiteralPath $installer.FullName "dist/TEDROX-Documents-$version-x64-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-dist
          path: dist/*

  linux:
    name: Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build --release -p tdx-cli
      - name: Stage tarball
        run: |
          set -euo pipefail
          mkdir -p dist/tdx-doc-linux-x86_64
          cp target/release/tdx-doc dist/tdx-doc-linux-x86_64/
          cp LICENSE README.md THIRD_PARTY_LICENSES.md dist/tdx-doc-linux-x86_64/
          tar -C dist -czf dist/tdx-doc-linux-x86_64.tar.gz tdx-doc-linux-x86_64
          sha256sum dist/tdx-doc-linux-x86_64.tar.gz | sed 's#dist/##' > dist/SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*

  publish:
    name: Publish release
    needs: [windows, desktop, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge checksums
        run: |
          set -euo pipefail
          cat artifacts/windows-dist/SHA256SUMS.txt artifacts/linux-dist/SHA256SUMS-linux.txt > artifacts/SHA256SUMS.txt
          sha256sum artifacts/desktop-dist/*.exe | sed 's#artifacts/desktop-dist/##' >> artifacts/SHA256SUMS.txt
          ls -la artifacts artifacts/desktop-dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/windows-dist/tdx-doc-windows-x86_64.zip
            artifacts/linux-dist/tdx-doc-linux-x86_64.tar.gz
            artifacts/desktop-dist/*.exe
            artifacts/SHA256SUMS.txt
