name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/i18n/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync dictionaries and release manifest
        run: |
          node scripts/sync-i18n.mjs
          node scripts/generate-releases.mjs || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web
      - id: deployment
        uses: actions/deploy-pages@v4
