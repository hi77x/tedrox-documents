name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --exclude tedrox-documents-desktop --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude tedrox-documents-desktop
      - name: Build CLI
        run: cargo build --release -p tdx-cli

  desktop:
    name: Desktop shell (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - name: Check shell
        run: cargo check -p tedrox-documents-desktop

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate localization dictionaries
        run: node scripts/sync-i18n.mjs
      - name: License audit
        run: node scripts/license-audit.mjs
      - name: Check generated files are committed
        run: |
          if ! git diff --quiet -- packages/i18n apps/web/i18n apps/desktop/src/i18n THIRD_PARTY_LICENSES.md; then
            echo "Generated files are out of date. Run the scripts and commit the result." >&2
            git diff --stat
            exit 1
          fi
